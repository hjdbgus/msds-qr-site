const FILE_INVENTORY = Array.isArray(window.PDF_INVENTORY) ? window.PDF_INVENTORY : [];
function pathNumbers(path) {
 const name = path.split('/').pop();
 const m = name.match(/^\s*\(?\s*(\d+(?:\s*[,、]\s*\d+)*)\s*\)?\s*(?:[.．_\s-]|$)/);
 return m ? m[1].split(/[,、]/).map(x => Number(x.trim())) : [];
}
function pathURL(path) {
 return path.split('/').map(part => encodeURIComponent(part)).join('/');
}
function chooseNumberFile(key,kind,no,current) {
 const prefix = 'pdf/' + key + '/' + kind + '/';
 const candidates = FILE_INVENTORY.filter(path => path.startsWith(prefix) && pathNumbers(path).includes(Number(no)));
 if (candidates.length === 1) return pathURL(candidates[0]);
 if (candidates.length > 1 && current) {
  const exact = candidates.find(path => pathURL(path) === current);
  if (exact) return pathURL(exact);
 }
 // Never pick arbitrarily when several documents share a number.
 if (candidates.length > 1) return '';
 if (!FILE_INVENTORY.length) return current || '';
 return FILE_INVENTORY.some(path => pathURL(path) === current) ? current : '';
}
function combinedGuide(key,current) {
 const prefix = 'pdf/' + key + '/guide/';
 const candidates = FILE_INVENTORY.filter(path => {
  const name = path.split('/').pop();
  return path.startsWith(prefix) && !pathNumbers(path).length && !/양식|서식|빈양식/.test(name) && /관리요령|통합/.test(name);
 });
 if (candidates.length === 1) return pathURL(candidates[0]);
 if (candidates.length > 1) return candidates.map(pathURL).includes(current) ? current : '';
 if (!FILE_INVENTORY.length && key === 'sebang') return current || '';
 return '';
}

 let doc = null;

 let busy = false;

 function fail(message) {
  status.textContent = message;
 }

  const target = new URL(source, location.href);
  const base = new URL('pdf/', location.href);
  if (target.origin !== base.origin || !target.pathname.startsWith(base.pathname) || !target.pathname.toLowerCase().endsWith('.pdf')) {
   fail('올바르지 않은 문서 경로입니다. 목록으로 돌아가 다시 열어 주세요.');
   return;
  }
 } catch (error) {
  fail('문서 경로를 확인할 수 없습니다.');
  return;
 }
 function updateButtons() {
  buttons[0].disabled = !doc || pageNumber <= 1;
  buttons[1].disabled = !doc || pageNumber >= doc.numPages;
  buttons[2].disabled = !doc || zoom <= 0.5;
  buttons[3].disabled = !doc || zoom >= 3;
 }
 async function draw() {

  }

    transform:ratio === 1 ? null : [ratio,0,0,ratio,0,0]
   }).promise;
   canvas.setAttribute('aria-label',requestedPage + '번째 PDF 페이지. 문서 내용은 이미지로 표시됩니다.');
   document.getElementById('pdfCounter').textContent = requestedPage + ' / ' + doc.numPages;
   status.textContent = '';
  } catch (error) {
   fail('페이지를 표시하지 못했습니다. 새로고침 후 다시 시도해 주세요.');
  } finally {
   busy = false;
   updateButtons();
   if (queued) {
    queued = false;
    draw();
   }
  }
 }
 buttons[0].onclick = function () {
  if (pageNumber > 1) {
   pageNumber -= 1;
   updateButtons();
   draw();
  }
 };
 buttons[1].onclick = function () {
  if (doc && pageNumber < doc.numPages) {
   pageNumber += 1;
   updateButtons();
   draw();
  }
 };
 buttons[2].onclick = function () {
  zoom = Math.max(0.5, zoom - 0.25);
  updateButtons();
  draw();
 };
 buttons[3].onclick = function () {
  zoom = Math.min(3, zoom + 0.25);
  updateButtons();
  draw();
 };
 window.addEventListener('resize',function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(draw,250);
 });
 const script = document.createElement('script');
 script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
 script.onerror = function () {
  fail('문서 뷰어를 불러오지 못했습니다. 인터넷 연결이나 외부 라이브러리 차단 여부를 확인해 주세요.');
 };
 script.onload = async function () {
  try {
   pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
   doc = await pdfjsLib.getDocument({url:source,isEvalSupported:false}).promise;
   updateButtons();
   await draw();
  } catch (error) {
   fail('PDF를 열지 못했습니다. 저장소의 PDF 파일 경로와 업로드 여부를 확인해 주세요. PC에서 파일을 더블클릭한 화면이 아니라 GitHub Pages 주소에서 확인해 주세요.');
  }
 };
 document.head.appendChild(script);
})();
